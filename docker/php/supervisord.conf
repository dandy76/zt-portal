[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pbx-monitor]
command=php /var/www/html/pbx-monitor/daemon/ucm_ami_listener.php
directory=/var/www/html/pbx-monitor
autostart=true
autorestart=true
startsecs=15
startretries=999
priority=20
stdout_logfile=/var/www/html/pbx-monitor/logs/daemon.log
stderr_logfile=/var/www/html/pbx-monitor/logs/daemon.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=5MB

[program:tenant-sync]
command=php /var/www/html/pbx-monitor/daemon/sync_to_tenant.php
directory=/var/www/html/pbx-monitor
autostart=true
autorestart=true
startsecs=5
startretries=999
priority=30
stdout_logfile=/var/www/html/pbx-monitor/logs/sync.log
stderr_logfile=/var/www/html/pbx-monitor/logs/sync.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=2MB
