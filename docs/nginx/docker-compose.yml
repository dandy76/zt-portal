services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "9443:9443"   # budibase.lan
      - "9444:9444"   # gitea.lan
      - "9445:9445"   # mattermost.lan
    volumes:
      - /share/Container/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /share/Container/certs/server/server.crt:/certs/server.crt:ro
      - /share/Container/certs/server/server.key:/certs/server.key:ro
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
