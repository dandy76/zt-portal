events {}

http {

    # budibase.lan → 9443
    server {
        listen 9443 ssl;
        server_name budibase.lan;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        if ($host != "budibase.lan") { return 444; }

        location / {
            proxy_pass http://budibase-1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # gitea.lan → 9444
    server {
        listen 9444 ssl;
        server_name gitea.lan;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        client_max_body_size 0;

        if ($host != "gitea.lan") { return 444; }

        location / {
            proxy_pass http://gitea-1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # mattermost.lan → 9445
    server {
        listen 9445 ssl;
        server_name mattermost.lan;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        if ($host != "mattermost.lan") { return 444; }

        location / {
            proxy_pass http://mattermost-app:8065;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
